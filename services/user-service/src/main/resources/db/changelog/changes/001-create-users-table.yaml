databaseChangeLog:

  - changeSet:
      id: 001-create-users-table
      author: stoliar

      changes:

        - createTable:
            tableName: users

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(320)
                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(50)
                  defaultValue: ROLE_USER
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: users
            columnNames: email
            constraintName: uk_users_email

        - createIndex:
            tableName: users
            indexName: idx_users_email
            columns:
              - column:
                  name: email
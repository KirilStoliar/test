spring:
  application:
    name: user-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/user_db}
    username: ${DATABASE_USERNAME:service_orders}
    password: ${DATABASE_PASSWORD:service_orders_dev}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:user-service}

    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:18081}

server:
  port: ${SERVER_PORT:8082}

security:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    persist-authorization: true
    doc-expansion: none

  show-actuator: true
  use-management-port: false
  packages-to-scan: com.stoliar.user.controller
databaseChangeLog:

  - changeSet:
      id: 001-create-products-table
      author: stoliar

      changes:

        - createTable:
            tableName: products

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: products
            indexName: idx_products_name
            columns:
              - column:
                  name: name

        - createIndex:
            tableName: products
            indexName: idx_products_active
            columns:
              - column:
                  name: active
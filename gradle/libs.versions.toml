[versions]

spring-boot = "3.5.6"
dependency-management = "1.1.7"
javax-annotation = "1.3.2"

avro = "1.12.0"
avro-plugin = "1.9.1"

confluent-platform = "7.7.1"

springdoc = "2.8.5"
swagger-annotations = "2.2.28"

liquibase = "4.31.1"

testcontainers = "1.21.3"

grpc = "1.69.0"
protobuf = "4.29.3"
protobuf-plugin = "0.9.5"


[libraries]

avro = { module = "org.apache.avro:avro", version.ref = "avro" }

javax-annotation-api = {module = "javax.annotation:javax.annotation-api", version.ref = "javax-annotation" }

confluent-kafka-avro-serializer = { module = "io.confluent:kafka-avro-serializer", version.ref = "confluent-platform" }

springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

swagger-annotations = { module = "io.swagger.core.v3:swagger-annotations", version.ref = "swagger-annotations" }

liquibase-core = { module = "org.liquibase:liquibase-core", version.ref = "liquibase" }

spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }

spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }

spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }

spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }

spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }

spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }

spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }

spring-boot-starter-data-mongodb = { module = "org.springframework.boot:spring-boot-starter-data-mongodb" }

spring-kafka = { module = "org.springframework.kafka:spring-kafka" }

spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }

spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

spring-security-test = { module = "org.springframework.security:spring-security-test" }

postgresql = { module = "org.postgresql:postgresql" }

testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }

testcontainers-mongodb = { module = "org.testcontainers:mongodb", version.ref = "testcontainers" }

testcontainers-kafka = { module = "org.testcontainers:kafka", version.ref = "testcontainers" }

grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }

grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }

grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }

protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }


[plugins]

spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }

dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }

avro = { id = "com.github.davidmc24.gradle.plugin.avro", version.ref = "avro-plugin" }